<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://gcmdlpaehqiujymxiysj.supabase.co; manifest-src 'self'; worker-src 'self'">
  <title>klip — Tareas</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#FAF8F5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="klip">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./public/icon.svg">
  <link rel="apple-touch-icon" href="./public/icon-192.png">

  <!-- Local CSS with @font-face -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div id="app">
    <!-- Top Navigation Bar -->
    <header class="top-nav-bar">
      <!-- Left: Brand Logo -->
      <div class="nav-left">
        <img class="brand-logo-img" src="./public/logo.svg" alt="klip" height="28">
      </div>

      <!-- Center: Sections Centered with Dot and Emerald Indicator + Emerald '+' button (Desktop) -->
      <div class="nav-center">
        <nav id="sections-list" class="sections-list-desktop" aria-label="Secciones">
          <!-- Rendered dynamically -->
        </nav>
        <button id="btn-new-section" class="btn-new-section-emerald" title="Crear sección" aria-label="Crear sección">
          +
        </button>
      </div>

      <!-- Right: User Icon & Logout Button (Desktop) -->
      <div class="nav-right">
        <div class="user-actions-group">
          <button class="nav-circle-btn" title="Perfil de usuario" aria-label="Perfil de usuario">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          <button id="btn-logout" class="nav-circle-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Top Bar Content (Screen < 768px) -->
      <div class="nav-mobile-row">
        <img class="mobile-logo-mark" src="./public/logo-mark.svg" alt="klip" height="26">
        <button id="btn-menu" class="btn-mobile-section-trigger" aria-label="Abrir menú de secciones">
          <span id="current-section-title" class="mobile-section-name">Personal</span>
          <svg class="trigger-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="mobile-user-actions">
          <button class="nav-circle-btn" title="Perfil de usuario" aria-label="Perfil de usuario">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          <button id="btn-logout-mobile" class="nav-circle-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Mobile Drawer Backdrop (Top-level under #app) -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Mobile Sections Panel (Top-level under #app) -->
    <aside id="sidebar" class="mobile-sections-panel" aria-label="Panel de secciones">
      <div class="mobile-panel-header">
        <span class="mobile-panel-title">SECCIONES</span>
        <button id="btn-close-sidebar" class="btn-close-panel" aria-label="Cerrar panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Scrollable Mobile Sections List -->
      <div id="mobile-sections-list" class="mobile-sections-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Emerald button to add section inside mobile panel -->
      <div class="mobile-panel-footer">
        <button id="btn-new-section-mobile" class="btn-add-section-mobile" aria-label="Nueva sección">
          + NUEVA SECCIÓN
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main">
      <!-- Section Header Area with Big Title, Rename/Delete Buttons & Counter Badge -->
      <section class="section-header-area">
        <div class="section-header-inner">
          <div class="section-title-row">
            <!-- Title + Small Action Buttons Group -->
            <div class="section-title-group">
              <h1 class="main-section-title" id="main-section-title">Personal</h1>
              <div class="section-title-actions">
                <button id="btn-rename-current-section" class="section-action-btn" title="Renombrar sección" aria-label="Renombrar sección">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
                <button id="btn-delete-current-section" class="section-action-btn" title="Eliminar sección" aria-label="Eliminar sección">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Counter Badge -->
            <span class="tasks-counter-badge" id="tasks-counter-badge">0 pendientes · 0 completadas</span>
          </div>

          <!-- Apartados (Lists) Strip directly below the title -->
          <div class="apartados-strip" aria-label="Apartados de la sección">
            <div id="lists-tabs" class="lists-tabs">
              <!-- Rendered dynamically as pills -->
            </div>
            <button id="btn-add-list" class="btn-add-apartado" title="Nuevo apartado" aria-label="Nuevo apartado">
              +
            </button>
          </div>
          <div class="section-utilities" aria-label="Vista y exportación">
            <div class="view-switch" role="group" aria-label="Vista">
              <button id="btn-view-tasks" class="utility-btn active" type="button">Tareas</button>
              <button id="btn-view-calendar" class="utility-btn" type="button">Calendario</button>
            </div>
            <div class="export-actions">
              <button id="btn-export-calendar" class="utility-btn" type="button">Exportar calendario (.ics)</button>
            </div>
          </div>
        </div>
      </section>

      <section id="task-detail-page" class="task-detail-page" hidden aria-labelledby="detail-task-title">
        <div class="task-detail-inner">
          <button id="btn-task-detail-back" class="utility-btn task-detail-back" type="button" aria-label="Volver a las tareas">← Volver a las tareas</button>
          <p id="task-detail-context" class="task-detail-context"></p>
          <form id="task-detail-form" class="task-detail-form">
            <label class="detail-field-label" for="detail-task-title">Tarea</label>
            <input id="detail-task-title" class="detail-title-input" type="text" maxlength="300" required>
            <label class="detail-field-label" for="detail-task-note">Notas</label>
            <textarea id="detail-task-note" class="form-textarea detail-note-input" placeholder="Agrega contexto o detalles..."></textarea>
            <div class="task-date-fields">
              <div class="form-group"><label class="form-label" for="detail-task-date">Fecha</label><input id="detail-task-date" class="form-input" type="date"></div>
              <div class="form-group"><label class="form-label" for="detail-task-time">Hora</label><input id="detail-task-time" class="form-input" type="time"></div>
            </div>
            <div class="task-detail-actions">
              <button class="utility-btn" type="submit">Guardar cambios</button>
              <button id="btn-detail-delete" class="btn-danger" type="button">Eliminar tarea</button>
              <span id="task-detail-save-status" class="task-detail-save-status" aria-live="polite"></span>
            </div>
          </form>

          <section class="subtasks-section" aria-labelledby="subtasks-heading">
            <div class="subtasks-heading-row"><h2 id="subtasks-heading">Subtareas</h2><span id="subtask-count" class="subtask-count"></span></div>
            <div id="subtasks-list" class="subtasks-list"></div>
            <form id="subtask-add-form" class="subtask-add-form">
              <input id="subtask-input" class="form-input" type="text" maxlength="300" placeholder="Agregar subtarea" required>
              <button class="btn-circle-submit" type="submit" aria-label="Agregar subtarea">+</button>
            </form>
          </section>
        </div>
      </section>

      <!-- Tasks Scroll Container -->
      <div class="tasks-scroll-container" id="tasks-scroll-container">
        <div class="tasks-content-wrapper">

          <div id="tasks-view">
          <!-- Simple centered empty state -->
          <div id="empty-state" class="empty-state">
            <p class="empty-text">No hay tareas pendientes en este apartado</p>
          </div>

          <!-- Active Tasks List -->
          <div id="active-tasks-list" class="tasks-cards-list">
            <!-- Rendered dynamically -->
          </div>

          <!-- Discrete Collapsible Completed Section -->
          <div id="completed-section" class="completed-section">
            <button id="completed-toggle-btn" class="completed-toggle-btn" aria-expanded="false">
              <svg class="completed-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
              <span id="completed-count-label">COMPLETADAS (0)</span>
            </button>
            <div id="completed-tasks-list" class="completed-tasks-cards">
              <!-- Rendered dynamically -->
            </div>
          </div>
          </div>
          <section id="calendar-view" class="calendar-panel" aria-label="Calendario mensual" hidden>
            <div class="calendar-heading">
              <button id="btn-calendar-prev" class="utility-btn" type="button" aria-label="Mes anterior">‹</button>
              <h2 id="calendar-month-label"></h2>
              <button id="btn-calendar-next" class="utility-btn" type="button" aria-label="Mes siguiente">›</button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
              <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
            </div>
            <div id="calendar-grid" class="calendar-grid"></div>
          </section>
        </div>
      </div>

      <!-- Bottom Fixed Add Task Bar -->
      <footer class="bottom-dock">
        <form id="add-task-form" class="add-task-dock-pill" autocomplete="off">
          <input
            type="text"
            id="task-input"
            class="task-input"
            placeholder="Agregar tarea"
            autofocus
            required
          >
          <button type="submit" id="btn-submit-task" class="btn-circle-submit" title="Agregar tarea" aria-label="Agregar tarea">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <!-- Sync indicator (outside #app so always visible) -->
  <div id="sync-indicator" class="sync-indicator" aria-live="polite"></div>

  <!-- Reusable Minimalist Modal -->
  <div id="modal-container" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Título</h2>
        <button id="btn-modal-close" class="btn-close-modal" aria-label="Cerrar modal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./db.js"></script>
  <script src="./supabase.js"></script>
  <script src="./auth.js"></script>
  <script src="./app.js"></script>
</body>
</html>
