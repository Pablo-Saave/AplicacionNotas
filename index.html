<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>klip — Tareas</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1D2B5C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="klip">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Local CSS with @font-face -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div id="app">
    <!-- Top Navigation Bar -->
    <header class="top-nav-bar">
      <!-- Left: Brand Logo -->
      <div class="nav-left">
        <span class="brand-logo">klip</span>
      </div>

      <!-- Center: Sections Centered with Dot and Emerald Indicator + Emerald '+' button (Desktop) -->
      <div class="nav-center">
        <nav id="sections-list" class="sections-list-desktop" aria-label="Secciones">
          <!-- Rendered dynamically -->
        </nav>
        <button id="btn-new-section" class="btn-new-section-emerald" title="Crear sección" aria-label="Crear sección">
          +
        </button>
      </div>

      <!-- Right: User Icon & Logout Button (Desktop) -->
      <div class="nav-right">
        <div class="user-actions-group">
          <button class="nav-circle-btn" title="Perfil de usuario" aria-label="Perfil de usuario">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          <button id="btn-logout" class="nav-circle-btn" title="Cerrar sesión" aria-label="Cerrar sesión" onclick="cerrarSesion()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Top Bar Content (Screen < 768px): Section Name & Trigger on Left, User & Logout on Right -->
      <div class="nav-mobile-row">
        <button id="btn-menu" class="btn-mobile-section-trigger" aria-label="Abrir menú de secciones">
          <span id="current-section-title" class="mobile-section-name">Personal</span>
          <svg class="trigger-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="mobile-user-actions">
          <button class="nav-circle-btn" title="Perfil de usuario" aria-label="Perfil de usuario">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          <button id="btn-logout-mobile" class="nav-circle-btn" title="Cerrar sesión" aria-label="Cerrar sesión" onclick="cerrarSesion()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Mobile Drawer Backdrop (Top-level under #app) -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Mobile Sections Panel (Top-level under #app) -->
    <aside id="sidebar" class="mobile-sections-panel" aria-label="Panel de secciones">
      <div class="mobile-panel-header">
        <span class="mobile-panel-title">SECCIONES</span>
        <button id="btn-close-sidebar" class="btn-close-panel" aria-label="Cerrar panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Scrollable Mobile Sections List (Without edit/delete icons inside list) -->
      <div id="mobile-sections-list" class="mobile-sections-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Emerald button to add section inside mobile panel -->
      <div class="mobile-panel-footer">
        <button id="btn-new-section-mobile" class="btn-add-section-mobile" aria-label="Nueva sección">
          + NUEVA SECCIÓN
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main">
      <!-- Section Header Area with Big Title, Rename/Delete Buttons & Counter Badge -->
      <section class="section-header-area">
        <div class="section-header-inner">
          <div class="section-title-row">
            <!-- Title + Small Action Buttons Group -->
            <div class="section-title-group">
              <h1 class="main-section-title" id="main-section-title">Personal</h1>
              <div class="section-title-actions">
                <button id="btn-rename-current-section" class="section-action-btn" title="Renombrar sección" aria-label="Renombrar sección">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
                <button id="btn-delete-current-section" class="section-action-btn" title="Eliminar sección" aria-label="Eliminar sección">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Counter Badge ("1 pendiente · 2 completadas") -->
            <span class="tasks-counter-badge" id="tasks-counter-badge">0 pendientes · 0 completadas</span>
          </div>

          <!-- Apartados (Lists) Strip directly below the title -->
          <div class="apartados-strip" aria-label="Apartados de la sección">
            <div id="lists-tabs" class="lists-tabs">
              <!-- Rendered dynamically as pills -->
            </div>
            <!-- Botón '+' esmeralda idéntico al de agregar sección -->
            <button id="btn-add-list" class="btn-add-apartado" title="Nuevo apartado" aria-label="Nuevo apartado">
              +
            </button>
          </div>
        </div>
      </section>

      <!-- Tasks Scroll Container -->
      <div class="tasks-scroll-container" id="tasks-scroll-container">
        <div class="tasks-content-wrapper">

          <!-- Simple centered empty state -->
          <div id="empty-state" class="empty-state">
            <p class="empty-text">No hay tareas pendientes en este apartado</p>
          </div>

          <!-- Active Tasks Cards (Lighter pink cards #FAF1EF with 18% ink blue border) -->
          <div id="active-tasks-list" class="tasks-cards-list">
            <!-- Rendered dynamically -->
          </div>

          <!-- Discrete Collapsible Completed Section -->
          <div id="completed-section" class="completed-section">
            <button id="completed-toggle-btn" class="completed-toggle-btn" aria-expanded="false">
              <svg class="completed-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
              <span id="completed-count-label">COMPLETADAS (0)</span>
            </button>
            <div id="completed-tasks-list" class="completed-tasks-cards">
              <!-- Rendered dynamically -->
            </div>
          </div>

        </div>
      </div>

      <!-- Bottom Fixed Add Task Bar (Solid Ink Blue #1D2B5C with Rosa Niebla placeholder) -->
      <footer class="bottom-dock">
        <form id="add-task-form" class="add-task-dock-pill" autocomplete="off">
          <input 
            type="text" 
            id="task-input" 
            class="task-input" 
            placeholder="Agregar tarea" 
            autofocus 
            required
          >
          <button type="submit" id="btn-submit-task" class="btn-circle-submit" title="Agregar tarea" aria-label="Agregar tarea">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <!-- Reusable Minimalist Modal -->
  <div id="modal-container" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Título</h2>
        <button id="btn-modal-close" class="btn-close-modal" aria-label="Cerrar modal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
